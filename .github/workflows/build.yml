name: Build Windows installer (Windows 7+, 32-bit)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (extract zip if present)
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Recurse -Filter "*.zip" -File | Select-Object -First 1
          if ($zip) {
            Write-Host "Extracting $($zip.FullName)"
            Expand-Archive -Path $zip.FullName -DestinationPath extracted -Force
          }
          $cmake = Get-ChildItem -Recurse -Filter "CMakeLists.txt" -File | Select-Object -First 1
          if (-not $cmake) {
            Get-ChildItem -Recurse | Select-Object -First 60 FullName
            Write-Error "CMakeLists.txt not found in the repository"
            exit 1
          }
          Write-Host "Project folder: $($cmake.DirectoryName)"
          "PROJECT_DIR=$($cmake.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

          - name: Locate Qt and MinGW
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"
          Write-Host "Qt5_DIR = $env:Qt5_DIR"
          Write-Host "IQTA_TOOLS = $env:IQTA_TOOLS"

          $qmake = Get-ChildItem D:\, C:\ -Recurse -Filter qmake.exe -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match 'mingw' } | Select-Object -First 1
          if (-not $qmake) { Write-Error "qmake.exe not found"; exit 1 }
          $qt = $qmake.Directory.Parent.FullName

          $gpp = Get-ChildItem D:\, C:\ -Recurse -Filter g++.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'mingw.*_32' } | Select-Object -First 1
          if (-not $gpp) { Write-Error "32-bit g++.exe not found"; exit 1 }
          $mingw = $gpp.Directory.Parent.FullName

          Write-Host "Qt: $qt"
          Write-Host "MinGW: $mingw"
          "QT_DIR=$qt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MINGW_DIR=$mingw" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure and build
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $qt = $env:QT_DIR
          $mingw = $env:MINGW_DIR
          $env:PATH = "$mingw\bin;$qt\bin;$env:PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER="$mingw/bin/g++.exe" `
            -DCMAKE_RC_COMPILER="$mingw/bin/windres.exe" `
            -DCMAKE_PREFIX_PATH="$qt"
          cmake --build build -- -k 0

      - name: Collect files (Qt DLLs + MinGW runtime)
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $qt = $env:QT_DIR
          $mingw = "$env:MINGW_DIR\bin"
          $env:PATH = "$mingw;$qt\bin;$env:PATH"

          Write-Host "--- check plugins ---"
          Get-ChildItem "$qt\plugins\platforms" | Select-Object Name

          New-Item -ItemType Directory -Force deploy | Out-Null
          Copy-Item build/Ganj.exe deploy/

          & "$qt\bin\windeployqt.exe" --release --no-translations --no-system-d3d-compiler `
            --no-opengl-sw --no-angle deploy/Ganj.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

          foreach ($d in 'libgcc_s_dw2-1.dll','libstdc++-6.dll','libwinpthread-1.dll') {
            if (-not (Test-Path "deploy/$d")) { Copy-Item "$mingw\$d" deploy/ }
          }
          if (Test-Path resources/fonts) { Copy-Item resources/fonts deploy/fonts -Recurse }
          Get-ChildItem deploy -Recurse | Select-Object FullName

      - name: Build installer
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\ganj.iss

      - uses: actions/upload-artifact@v4
        with:
          name: GanjLibrarySetup
          path: ${{ env.PROJECT_DIR }}/dist/GanjLibrarySetup.exe
